<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="ttl" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="ttl">ml_convertor qanday ishlaydi: buyruq, mahalliy ofis dasturi, tayyor fayl va log — internetga chiqmasdan</title>
<style>
.t{fill:#e6edf3;font-size:14px;font-weight:600}
.s{fill:#8b949e;font-size:11px}
.n{fill:#58a6ff;font-size:11px;font-weight:700;letter-spacing:1px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.wire{stroke:#30363d;stroke-width:2;fill:none;stroke-dasharray:3 6;animation:flow 1s linear infinite}
.dot{fill:#58a6ff;opacity:0;filter:drop-shadow(0 0 5px #58a6ff)}
.fb{transform-box:fill-box}
.type{transform-origin:left;animation:type 12s infinite}
.cur{animation:cur 12s infinite}
.gear{transform-origin:center;animation:spin 3s linear infinite}
.eng{animation:glow 12s infinite}
.pdf{transform-origin:center;animation:pdf 12s infinite}
.out{animation:show72 12s infinite}
.l1{animation:show34 12s infinite}
.l2{animation:show46 12s infinite}
@keyframes flow{to{stroke-dashoffset:-9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes type{0%,5%{transform:scaleX(0);animation-timing-function:steps(50,end)}30%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes cur{0%,5%{transform:translateX(0);animation-timing-function:steps(50,end)}30%,97%{transform:translateX(424px)}100%{transform:translateX(0)}}
@keyframes glow{0%,41%,64%,100%{stroke:#30363d;fill:#161b22}46%,60%{stroke:#58a6ff;fill:#111d2e}}
@keyframes pdf{0%,69%{opacity:0;transform:scale(.6)}73%{opacity:1;transform:scale(1.08)}76%,97%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes show34{0%,33%{opacity:0}35%,97%{opacity:1}100%{opacity:0}}
@keyframes show46{0%,45%{opacity:0}47%,97%{opacity:1}100%{opacity:0}}
@keyframes show72{0%,72%{opacity:0}74%,97%{opacity:1}100%{opacity:0}}
</style>

