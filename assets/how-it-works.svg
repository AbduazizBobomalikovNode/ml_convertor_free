<circle r="5" class="dot"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M445 285H515" keyPoints="0;0;1;1" keyTimes="0;.62;.70;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.62;.63;.69;.70;1"/></circle>
